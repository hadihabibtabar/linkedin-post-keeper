<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>LinkedIn Post Keeper</title>
  <style>
    :root {
      --bg: #f3f2ef; --surface: #ffffff; --fg: #1d2226; --muted: #6b7680;
      --line: #e3e6ea; --accent: #0a66c2; --accent-soft: #e8f1fb;
      --mark: #ffe58f; --danger: #c0392b; --shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171a; --surface: #1f2428; --fg: #e8eaed; --muted: #94a0ab;
        --line: #2f363d; --accent: #70b5f9; --accent-soft: #1d2f43;
        --mark: #6b5a14; --danger: #ff8a7a; --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; }
    /* Chrome popups max out at 600px tall. Fix the height and let only the
       results list scroll, so the search box and footer buttons stay visible. */
    body {
      width: 440px; height: 600px; display: flex; flex-direction: column;
      background: var(--bg); color: var(--fg);
      font: 14px/1.65 system-ui, "Segoe UI", Tahoma, "Vazirmatn", sans-serif;
    }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 10px; background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    header img { width: 32px; height: 32px; border-radius: 8px; }
    .title { font-weight: 700; font-size: 15px; line-height: 1.3; }
    .sub { font-size: 12px; color: var(--muted); }

    .search { position: relative; padding: 12px 16px 6px; background: var(--surface); }
    .search svg {
      position: absolute; inset-inline-start: 28px; top: 50%; margin-top: -2px;
      transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted);
      pointer-events: none;
    }
    input[type=search] {
      width: 100%; height: 40px; padding: 0 40px; font: inherit;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--bg); color: var(--fg); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=search]:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .status {
      padding: 6px 16px 10px; background: var(--surface);
      border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
    }

    header, .search, .status, footer { flex: none; }
    #results { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 12px 4px; }
    #results::-webkit-scrollbar { width: 8px; }
    #results::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

    .item {
      display: grid; grid-template-columns: 38px 1fr; gap: 10px;
      padding: 12px; margin-bottom: 10px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
      transition: border-color .15s, transform .15s;
    }
    .item:hover { border-color: var(--accent); transform: translateY(-1px); }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 16px;
    }
    .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .author { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .time { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
    .snippet {
      margin: 3px 0 8px; color: var(--fg); white-space: pre-wrap;
      word-break: break-word; display: -webkit-box; -webkit-line-clamp: 5;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
    .actions { display: flex; gap: 8px; }
    .btn {
      font: inherit; font-size: 12px; padding: 3px 12px; border-radius: 999px;
      border: 1px solid var(--line); background: transparent; color: var(--fg);
      cursor: pointer; text-decoration: none; line-height: 1.7;
    }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn:hover { filter: brightness(.95); }

    .empty { text-align: center; color: var(--muted); padding: 36px 20px 28px; }
    .empty svg { width: 44px; height: 44px; margin-bottom: 8px; opacity: .6; }
    .empty b { display: block; color: var(--fg); margin-bottom: 2px; }

    footer {
      display: flex; justify-content: space-between; padding: 8px 16px 10px;
      font-size: 12px; background: var(--surface); border-top: 1px solid var(--line);
    }
    footer button {
      font: inherit; background: none; border: none; cursor: pointer;
      color: var(--accent); padding: 2px 0;
    }
    footer button.danger { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div>
      <div class="title">LinkedIn Post Archive</div>
      <div class="sub" id="count"></div>
    </div>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
    </svg>
    <input id="q" type="search" placeholder="Search post text or author name…" autofocus>
  </div>
  <div class="status" id="status"></div>

  <div id="results"></div>

  <footer>
    <button id="export">Export JSON</button>
    <button id="clear" class="danger">Clear archive</button>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
